name: Site publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://vestekaart.mhavers.nl/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # GitHub vindt het pakket soms niet direct terug. Dan wachten we even en
      # proberen we het nog twee keer, in plaats van meteen te mislukken.
      - id: poging1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.poging1.outcome == 'failure'
        run: sleep 30
      - id: poging2
        if: steps.poging1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.poging1.outcome == 'failure' && steps.poging2.outcome == 'failure'
        run: sleep 60
      - if: steps.poging1.outcome == 'failure' && steps.poging2.outcome == 'failure'
        uses: actions/deploy-pages@v4
