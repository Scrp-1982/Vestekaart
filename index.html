<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5E0C16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vestekaart">
<title>Vestekaart</title>
<script>
  // Licht of donker van dit apparaat meteen toepassen, zodat er niets verspringt
  try {
    var t = localStorage.getItem("vestekaart-thema");
    t = t === "donker" ? "zwart" : t;
    if (["licht", "wit", "zwart", "rood", "ruit"].indexOf(t) >= 0) document.documentElement.dataset.thema = t;
  } catch (e) {}
</script>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<style>
:root {
  --rood: #A51225;
  --rood-donker: #7A0E1A;
  --rood-diep: #3A0A10;
  --rood-verloop: linear-gradient(100deg, #3A0A10 0%, #6E0D18 50%, #A51225 100%);
  --inkt: #23262E;
  --grijs: #6B7180;
  --lijn: #DDE0E6;
  --vlak: #FFFFFF;
  --achter: #EEF0F3;
  --goud: #E8A317;
  --groen: #1F8A5B;
  --tekst-op-rood: #FFFFFF;
  --kop: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --romp: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --rood-tekst: #A51225;
  --achter-beeld: none;
  --kop-verloop: var(--rood-verloop);
  --kop-rand: 0;
  --tekst-achter: var(--inkt);
  color-scheme: light;
}
/* Weergave per shirt. Automatisch: wit of zwart volgens de telefoon. */
@media (prefers-color-scheme: dark) {
  :root:not([data-thema]) {
    --inkt: #ECECEF;
    --grijs: #9A9AA3;
    --lijn: #2E2E34;
    --vlak: #1B1B1F;
    --achter: #0E0E10;
    --groen: #3DBE85;
    --rood: #C21A30;
    --rood-tekst: #FF6B7D;
    --achter-beeld: linear-gradient(180deg, rgba(194, 26, 48, .16), transparent 260px);
    --kop-verloop: linear-gradient(100deg, #0E0E10 0%, #1B1B1F 55%, #3A0A10 100%);
    --kop-rand: 3px solid #C21A30;
    --tekst-achter: #ECECEF;
    color-scheme: dark;
  }
}
/* Zwart shirt: zwart met rode accenten */
:root[data-thema="zwart"] {
  --inkt: #ECECEF;
  --grijs: #9A9AA3;
  --lijn: #2E2E34;
  --vlak: #1B1B1F;
  --achter: #0E0E10;
  --groen: #3DBE85;
  --rood: #C21A30;
  --rood-tekst: #FF6B7D;
  --achter-beeld: linear-gradient(180deg, rgba(194, 26, 48, .16), transparent 260px);
  --kop-verloop: linear-gradient(100deg, #0E0E10 0%, #1B1B1F 55%, #3A0A10 100%);
  --kop-rand: 3px solid #C21A30;
  --tekst-achter: #ECECEF;
  color-scheme: dark;
}
/* Licht (standaard): geen extra regels, alleen nooit donker */
/* Wit shirt: wit met twee rode banen door het midden */
:root[data-thema="wit"] {
  --achter: #F4F4F5;
  --achter-beeld: linear-gradient(90deg,
    transparent calc(50% - 36px),
    rgba(142, 15, 33, .85) calc(50% - 36px), rgba(142, 15, 33, .85) calc(50% - 12px),
    rgba(215, 25, 47, .85) calc(50% - 12px), rgba(215, 25, 47, .85) calc(50% + 36px),
    transparent calc(50% + 36px));
}
/* Op de rode baan blijven tussenkopjes leesbaar */
:root[data-thema="wit"] main > .stapel > h3 {
  justify-self: start; background: var(--achter); padding: 2px 10px; margin-left: -10px; border-radius: 0 8px 8px 0;
}
/* Rood shirt: egaal rood */
:root[data-thema="rood"] {
  --achter: #C3182F;
  --kop-verloop: linear-gradient(100deg, #3A0A10 0%, #6E0D18 55%, #8E0F21 100%);
  --tekst-achter: #FFFFFF;
}
/* Ruitjesshirt: donkerblauw met groene en blauwe ruit */
:root[data-thema="ruit"] {
  --inkt: #EEF1F8;
  --grijs: #A3ACC6;
  --lijn: #34406A;
  --vlak: #1F2949;
  --achter: #161D36;
  --groen: #3DBE85;
  --rood: #C8102E;
  --rood-tekst: #FF7A8A;
  --achter-beeld:
    repeating-linear-gradient(0deg, transparent 0 46px, rgba(255, 255, 255, .10) 46px 48px, transparent 48px 96px),
    repeating-linear-gradient(90deg, transparent 0 46px, rgba(255, 255, 255, .10) 46px 48px, transparent 48px 96px),
    repeating-linear-gradient(0deg, rgba(34, 120, 92, .45) 0 22px, transparent 22px 96px),
    repeating-linear-gradient(90deg, rgba(34, 120, 92, .45) 0 22px, transparent 22px 96px),
    repeating-linear-gradient(0deg, transparent 0 66px, rgba(0, 0, 0, .28) 66px 80px, transparent 80px 96px),
    repeating-linear-gradient(90deg, transparent 0 66px, rgba(0, 0, 0, .28) 66px 80px, transparent 80px 96px);
  --kop-verloop: linear-gradient(100deg, #0D1330 0%, #1A2342 60%, #24305A 100%);
  --tekst-achter: #EEF1F8;
  color-scheme: dark;
}
.shirtkeuze { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.shirtkeuze button {
  border: 2px solid var(--lijn); background: var(--achter); border-radius: 12px; padding: 8px 4px 8px;
  cursor: pointer; display: grid; justify-items: center; gap: 4px; font-weight: 600; color: var(--inkt);
}
.shirtkeuze button.aan { border-color: var(--rood); box-shadow: 0 0 0 1px var(--rood); background: var(--vlak); }
.shirtkeuze .shirt { width: 100%; max-width: 72px; height: auto; filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); }
[hidden] { display: none !important; }
#betaalBlok { scroll-margin-top: 80px; }
.melding-weg { display: flex; align-items: flex-start; gap: 10px; }
.melding-weg a { flex: 1; }
.weg-knop { background: none; border: 0; font-size: 1.4rem; line-height: 1; padding: 0 2px; cursor: pointer; color: inherit; opacity: .7; }
.inklaplijst { display: grid; gap: 8px; }
.betaal-bedrag { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.betaal-bedrag .getal { font-size: 2.2rem; line-height: 1; }
.knop.tikkie { text-align: center; text-decoration: none; display: block; font-size: 1.05rem; padding: 14px 16px; }
.betaal-klaar { display: grid; gap: 6px; border-top: 1px solid var(--lijn); padding-top: 12px; }
details.rekening > summary { cursor: pointer; color: var(--grijs); }
#fotoStatus:empty { display: none; }
details.inklap { padding: 0; gap: 0; }
details.inklap > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; cursor: pointer; }
details.inklap > summary::-webkit-details-marker { display: none; }
details.inklap > summary .pijl { width: 20px; height: 20px; color: var(--grijs); transition: transform .15s; flex: none; }
details.inklap[open] > summary .pijl { transform: rotate(180deg); }
details.inklap .inklap-binnen { padding: 0 16px 16px; }
.zonder { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.zonder button { border: 2px solid var(--lijn); background: var(--vlak); color: var(--inkt); border-radius: 999px; padding: 4px 12px; font-weight: 600; cursor: pointer; }
.zonder button.aan { border-color: var(--rood); color: var(--rood-tekst); }
.kleurkeuze { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.kleurkeuze button {
  border: 2px solid var(--lijn); background: var(--vlak); border-radius: 12px; padding: 0 0 10px;
  overflow: hidden; cursor: pointer; display: grid; gap: 8px; font-weight: 600; color: var(--inkt);
}
.kleurkeuze button.aan { border-color: var(--rood); box-shadow: 0 0 0 1px var(--rood); }
.kleurkeuze .staal { height: 46px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; border-bottom: 1px solid var(--lijn); }

* { box-sizing: border-box; }
main > .stapel > h3, main > h3, main > .stapel > .klein { color: var(--tekst-achter); }
html, body { margin: 0; }
/* Elke pagina is minstens één pixel hoger dan het scherm, ook als er weinig op staat
   (zoals op Home). Op de andere pagina's zet de iPhone de onderbalk goed neer omdat ze
   langer zijn dan het scherm; zo gedraagt Home zich precies hetzelfde. */
html { background-color: var(--achter); }
body {
  min-height: calc(100vh + 1px);
  min-height: calc(100lvh + 1px);
  font-family: var(--romp);
  font-size: 16px;
  line-height: 1.45;
  color: var(--inkt);
  background-color: var(--achter);
  background-image: var(--achter-beeld);
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--rood); }
h1, h2, h3 { font-family: var(--kop); font-weight: 600; letter-spacing: .01em; line-height: 1.1; margin: 0; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.25rem; }
.muted { color: var(--grijs); }
.klein { font-size: .875rem; }
.getal { font-family: var(--kop); font-variant-numeric: tabular-nums; font-weight: 600; }
.rechts { text-align: right; }
:focus-visible { outline: 3px solid var(--goud); outline-offset: 2px; }

/* Kop */
header.balk {
  background: var(--kop-verloop);
  border-bottom: var(--kop-rand);
  color: var(--tekst-op-rood);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
}
header.balk h1 { font-size: 1.5rem; flex: 1; }
header.balk .terug {
  background: none; border: 0; color: inherit; font-size: 1.5rem; line-height: 1;
  padding: 4px 8px 4px 0; cursor: pointer;
}
main { max-width: 640px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }

/* Onderbalk */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--vlak); border-top: 1px solid var(--lijn);
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs a {
  flex: 1; max-width: 160px; text-align: center; text-decoration: none; color: var(--grijs);
  padding: 10px 4px 12px; font-family: var(--kop); font-size: 1.05rem; font-weight: 600;
  border-top: 3px solid transparent;
}
nav.tabs a.aan { color: var(--rood); border-top-color: var(--rood); }

/* De kaart: donkerrood met rook, zware kop en een sierlijk saldo */
.kaart {
  position: relative; overflow: hidden; isolation: isolate;
  border-radius: 18px; color: #fff; text-align: center;
  aspect-ratio: 1.586 / 1; max-height: 260px; width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 10px 18px 50px;
  background:
    radial-gradient(120% 90% at 50% 120%, #C8102E 0%, rgba(200,16,46,0) 60%),
    radial-gradient(60% 50% at 15% 20%, rgba(0,0,0,.45), transparent 70%),
    radial-gradient(70% 60% at 90% 10%, rgba(20,0,4,.55), transparent 70%),
    radial-gradient(50% 40% at 70% 70%, rgba(255,90,90,.18), transparent 70%),
    linear-gradient(160deg, #3a0a10 0%, #7a0e1a 55%, #a51225 100%);
  box-shadow: 0 10px 24px -12px rgba(90, 6, 18, .8);
}
.kaart::before {
  content: ""; position: absolute; inset: -20%; z-index: -1; opacity: .35; filter: blur(18px);
  background:
    radial-gradient(30% 22% at 30% 60%, rgba(255,255,255,.18), transparent 70%),
    radial-gradient(25% 18% at 65% 35%, rgba(255,255,255,.12), transparent 70%),
    radial-gradient(35% 25% at 80% 80%, rgba(0,0,0,.5), transparent 70%);
}
.kaart .ros { height: 32px; width: auto; margin-bottom: 4px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
.kaart .kop { font-family: var(--kop); font-weight: 800; font-size: 1.9rem; letter-spacing: .05em; line-height: .9; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,.35); }
.kaart .saldo, .kaart .sier, .kaart .hoek { font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-style: italic; font-weight: 500; }
.kaart .saldo { font-size: clamp(2.4rem, 12vw, 3.4rem); line-height: 1.05; text-shadow: 0 3px 14px rgba(0,0,0,.35); }
.kaart .sier { font-size: .95rem; opacity: .9; margin-top: 4px; }
.kaart .hoek { position: absolute; top: 12px; right: 16px; font-size: .85rem; opacity: .9; }
.kaart .onder { position: absolute; left: 18px; right: 18px; bottom: 12px; display: flex; justify-content: space-between; gap: 12px; font-size: .8rem; opacity: .92; }
.kaart .onder span { text-align: left; }
.kaart .onder .rechts { text-align: right; }
.kaart .onder b { font-family: var(--kop); font-weight: 600; font-size: 1.05rem; display: block; letter-spacing: .02em; }

/* Vlakken en lijsten */
.vlak { background: var(--vlak); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.vlak > h3 { margin-bottom: -2px; }
.status { border-radius: 10px; padding: 12px 14px; font-size: .95rem; }
.status.goed { background: color-mix(in srgb, var(--groen) 14%, var(--vlak)); }
.status.let { background: color-mix(in srgb, var(--goud) 22%, var(--vlak)); }
ul.lijst { list-style: none; margin: 0; padding: 0; }
ul.lijst > li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--lijn); }
ul.lijst > li:first-child { border-top: 0; }
ul.lijst .groei { flex: 1; min-width: 0; }
.stip { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.letters {
  width: 30px; height: 30px; border-radius: 50%; flex: none; color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--kop); font-weight: 700; font-size: .95rem;
}
.open { color: var(--rood-tekst); }

/* Wedstrijden als kaartjes met een scheurlijn */
.ticket {
  display: grid; grid-template-columns: 64px 1fr auto; align-items: center;
  background: var(--vlak); border-radius: 12px; text-decoration: none; color: inherit;
  position: relative; min-height: 64px;
}
.ticket .dag {
  text-align: center; font-family: var(--kop); line-height: 1; padding: 10px 0;
  border-right: 2px dashed var(--rood); height: 100%;
  display: flex; flex-direction: column; justify-content: center;
}
.ticket .dag b { font-size: 1.6rem; display: block; }
.ticket .dag span { font-size: .85rem; color: var(--grijs); }
.ticket .wie { padding: 10px 12px; min-width: 0; }
.ticket .wie b { font-family: var(--kop); font-size: 1.2rem; font-weight: 600; display: block; }
.ticket .bedrag { padding: 10px 14px 10px 0; text-align: right; }
.ticket::before, .ticket::after {
  content: ""; position: absolute; left: 57px; width: 14px; height: 7px; background: var(--achter);
}
.ticket::before { top: 0; border-radius: 0 0 7px 7px; }
.ticket::after { bottom: 0; border-radius: 7px 7px 0 0; }
.tickets { display: grid; gap: 8px; }

/* Bon van een aankoop */
.bon { background: var(--vlak); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.bon-kop { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.bon-kop b { font-family: var(--kop); font-size: 1.25rem; }
.verdeling { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--lijn); }
.verdeling span { display: block; height: 100%; }
.regel { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.regel .groei { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 4px 3px 10px;
  color: #fff; font-size: .875rem; font-weight: 600;
}
.chip button { background: rgba(0,0,0,.18); color: #fff; border: 0; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; line-height: 1; }
.chip.zonder { padding-right: 10px; }

/* Knoppen en velden */
.knop {
  background: var(--rood); color: #fff; border: 0; border-radius: 10px;
  padding: 10px 16px; font-weight: 600; cursor: pointer; min-height: 42px;
}
.knop:hover { background: var(--rood-donker); }
.knop.licht { background: transparent; color: var(--rood-tekst); box-shadow: inset 0 0 0 2px var(--rood-tekst); }
.knop.klein { padding: 6px 12px; min-height: 34px; font-size: .9rem; }
.knop[disabled] { opacity: .5; cursor: default; }
.veld { display: grid; gap: 4px; }
.veld > span { font-size: .875rem; color: var(--grijs); }
input, select, textarea {
  width: 100%; border: 1px solid var(--lijn); background: var(--vlak); border-radius: 10px;
  padding: 10px 12px; min-height: 42px;
}
textarea { min-height: 90px; resize: vertical; }
/* Datum- en tijdvelden even hoog en breed als de andere velden (iPhone) */
input[type=date], input[type=time] {
  -webkit-appearance: none; appearance: none; display: block;
  min-width: 0; height: 42px; line-height: 20px;
}
input[type=date]::-webkit-date-and-time-value, input[type=time]::-webkit-date-and-time-value { text-align: left; margin: 0; }
.veld { min-width: 0; }
.twee { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
.rij { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.rij > * { flex: 1; min-width: 120px; }
.rij > .knop { flex: none; }
.seg { display: flex; background: var(--vlak); border-radius: 10px; padding: 4px; gap: 2px; overflow-x: auto; }
.seg a, .seg button {
  flex: 1; text-align: center; border: 0; background: none; padding: 8px 3px; border-radius: 8px; font-size: .82rem;
  text-decoration: none; color: var(--grijs); font-weight: 600; cursor: pointer; white-space: nowrap;
}
.seg .aan { background: var(--rood); color: #fff; }
.stapel { display: grid; gap: 12px; }
.drie { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.drie b { font-size: 1.35rem; display: block; }
.knoppen { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.persoon { display: flex; gap: 10px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.claimrij { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: end; }
.tekstknop { background: none; border: 0; padding: 4px 0; color: var(--grijs); text-decoration: underline; cursor: pointer; justify-self: start; font-size: .875rem; }
.leeg { text-align: center; padding: 24px 16px; }
pre.verslag { white-space: pre-wrap; font-size: .85rem; margin: 0; background: var(--achter); padding: 10px; border-radius: 8px; overflow-x: auto; }

/* Menu */
.menuknop {
  background: none; border: 0; color: inherit; padding: 6px; margin-left: -6px; cursor: pointer;
  display: inline-flex; border-radius: 8px;
}
.menuknop svg { width: 26px; height: 26px; }
.menuknop[hidden] { display: none; }
.kop-avatar { display: inline-flex; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
.kop-avatar .avatar, .kop-avatar .letters { display: inline-flex; }
.menu { position: fixed; inset: 0; z-index: 30; background: rgba(20, 22, 28, .45); }
.menu[hidden] { display: none; }
.menu-paneel {
  position: absolute; top: 0; bottom: 0; left: 0; width: min(300px, 84vw);
  background: var(--vlak); padding: calc(env(safe-area-inset-top, 0px) + 16px) 0 16px;
  display: flex; flex-direction: column; box-shadow: 8px 0 30px rgba(0,0,0,.25);
  animation: inschuiven .18s ease-out;
}
@keyframes inschuiven { from { transform: translateX(-100%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .menu-paneel { animation: none; } }
.menu-wie { display: flex; gap: 12px; align-items: center; padding: 4px 20px 16px; border-bottom: 1px solid var(--lijn); }
.avatar { border-radius: 50%; object-fit: cover; flex: none; display: inline-block; background: var(--achter); }
.fotoknoppen { display: flex; gap: 8px; flex-wrap: wrap; }
.menu-paneel nav { display: grid; padding: 8px 0; }
.menu-paneel nav a {
  padding: 12px 20px; text-decoration: none; color: var(--inkt); font-family: var(--kop);
  font-size: 1.3rem; font-weight: 600; border-left: 4px solid transparent;
}
.menu-paneel nav a.aan { border-left-color: var(--rood); color: var(--rood); }
.menu-paneel .scheiding { height: 1px; background: var(--lijn); margin: 8px 0; }
.menu-voet { margin-top: auto; padding: 0 20px; }

/* Screenshots */
.galerij { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.duim {
  border: 0; padding: 0; background: var(--achter); border-radius: 8px; overflow: hidden; cursor: zoom-in;
  aspect-ratio: 9 / 16; display: block; width: 100%;
}
.duim img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.kijker {
  position: fixed; inset: 0; z-index: 40; background: #0E0F12; color: #fff;
  display: flex; flex-direction: column;
}
.kijker[hidden] { display: none; }
.kijker-balk {
  display: flex; gap: 8px; justify-content: space-between; align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
}
.kijker-balk button { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.kijker-beeld {
  flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.kijker-beeld::-webkit-scrollbar { display: none; }
.kijker .dia {
  flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; overflow-y: auto;
  padding: 0 8px calc(env(safe-area-inset-bottom, 0px) + 8px); text-align: center;
}
.kijker .dia img { max-width: 100%; height: auto; }
#kijkerTeller { font-weight: 600; opacity: .85; }
.kijker-pijl {
  position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%;
  border: 0; background: rgba(255,255,255,.16); color: #fff; font-size: 1.8rem; line-height: 1; cursor: pointer;
}
.kijker-pijl.links { left: 8px; } .kijker-pijl.rechts { right: 8px; }
.kijker-pijl[hidden] { display: none; }
@media (hover: none) { .kijker-pijl { display: none; } }
.voorstel { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--lijn); }
.voorstel:first-of-type { border-top: 0; }
.voorstel input[type=checkbox] { width: 22px; height: 22px; min-height: 0; margin-top: 2px; }
.voorstel .extra { grid-column: 2 / 4; display: grid; gap: 6px; }
.label { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: .8rem; font-weight: 600; }
.label.nieuw { background: color-mix(in srgb, var(--groen) 18%, var(--vlak)); color: var(--groen); }
.label.aanvullen { background: color-mix(in srgb, #2F6FDE 18%, var(--vlak)); color: #2F6FDE; }
.label.bestaat, .label.let { background: color-mix(in srgb, var(--goud) 25%, var(--vlak)); }
input[type=file] { padding: 8px; }

/* Home en invullen */
.mijnopen { display: grid; gap: 6px; text-decoration: none; color: inherit; border-left: 6px solid var(--rood); }
.mijnopen .groot { font-family: var(--kop); font-size: 2.4rem; font-weight: 700; line-height: 1; color: var(--rood-tekst); }
.label.nieuw-w { background: var(--rood); color: #fff; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--lijn); }
.item:first-child { border-top: 0; }
.item .groei { flex: 1; min-width: 0; display: grid; gap: 4px; }
.item .naam { font-weight: 600; font-size: 1.05rem; }
.stepper { display: flex; align-items: center; gap: 4px; flex: none; }
.stepper button {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--rood); background: var(--vlak);
  color: var(--rood); font-size: 1.5rem; line-height: 1; cursor: pointer; font-weight: 600;
}
.stepper button.plus { background: var(--rood); color: #fff; }
.stepper button[disabled] { opacity: .3; cursor: default; }
.stepper .aantal { min-width: 32px; text-align: center; font-family: var(--kop); font-size: 1.5rem; font-weight: 700; }
.mini { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; color: var(--grijs); margin-right: 8px; }
.mini .stip { width: 8px; height: 8px; }
.jouw { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.jouw .groot { font-family: var(--kop); font-size: 2.2rem; font-weight: 700; line-height: 1; }
details.alle > summary { cursor: pointer; color: var(--grijs); font-size: .9rem; padding: 4px 0; }

/* Tweestap */
.codeveld { font-family: var(--kop); font-size: 2rem; letter-spacing: .3em; text-align: center; min-height: 56px; }
.qr { width: 200px; height: 200px; background: #fff; padding: 8px; border-radius: 10px; justify-self: center; }
.sleutel { word-break: break-all; font-size: .85rem; }
.label.tweestap { background: color-mix(in srgb, var(--groen) 18%, var(--vlak)); color: var(--groen); }

/* Deelnemers als uitklaplijst */
.teller { display: inline-block; min-width: 26px; padding: 1px 8px; border-radius: 999px; background: var(--achter); font-family: var(--romp); font-size: .9rem; font-weight: 600; text-align: center; vertical-align: middle; margin-left: 6px; }
.accordeon { display: grid; gap: 8px; }
.accordeon details { border: 1px solid var(--lijn); border-radius: 12px; background: var(--vlak); overflow: hidden; }
.accordeon summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; }
.accordeon summary::-webkit-details-marker { display: none; }
.accordeon summary .groei { flex: 1; min-width: 0; }
.accordeon summary .groei b { display: block; }
.accordeon summary .pijl { width: 20px; height: 20px; color: var(--grijs); transition: transform .15s; flex: none; }
.accordeon details[open] summary .pijl { transform: rotate(180deg); }
.accordeon details[open] summary { border-bottom: 1px solid var(--lijn); }
.accordeon .binnen { padding: 12px; display: grid; gap: 12px; }
.accordeon .info { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
.accordeon .rollen { display: grid; gap: 10px; justify-items: end; }
.accordeon .rollen label { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: .95rem; }
.accordeon .rollen input { width: 22px; height: 22px; min-height: 0; accent-color: var(--rood); }
.chip-slot { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 600;
  background: color-mix(in srgb, var(--groen) 16%, var(--vlak)); color: var(--groen); }
.chip-slot.uit { background: color-mix(in srgb, var(--goud) 22%, var(--vlak)); color: var(--inkt); }
.label.rol { background: color-mix(in srgb, var(--rood) 12%, var(--vlak)); color: var(--rood-tekst); }

/* Melding */
#toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--inkt); color: var(--achter); padding: 10px 16px; border-radius: 10px; z-index: 20;
  max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); display: none;
}

/* Inloggen */
.welkom { display: grid; gap: 16px; padding-top: 8px; }
.welkom .kaart { max-height: 220px; }
</style>
</head>
<body>
<header class="balk">
  <button class="menuknop" id="menuknop" hidden aria-label="Menu openen" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

<div id="toast" role="status" aria-live="polite"></div>

<script>
// =====================================================================
// Vestekaart – app
// =====================================================================
const VERSIE = "2026-11-11.3";
const SUPABASE_URL = "https://aealwjmfdbmxuyrqblzo.supabase.co";
const SUPABASE_KEY = "sb_publishable_0ZG0KCFprUcN27AoaLVK-Q_ynCeVqNQ";
const APP_URL = "https://vestekaart.mhavers.nl/";
const VAPID_PUBLIEK = "BJILunTyTTs1tVMGS59tTBKmLGs3gKe2ph4sgGstHDLDTZObQbcaxS81N9Tiw0zaXkOvBo45Blapi1x9L8E1nvA";
const KLEUREN = ["#2F6FDE", "#E8A317", "#1F8A5B", "#8B5CF6", "#E4572E", "#0EA5B7", "#D946A8", "#64748B"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const scherm = () => $("#scherm");

const S = {
  user: null, ik: null, deelnemers: [], saldo: [], wedstrijden: [], pot: null,
  transacties: [], regels: [], claims: [], betalingen: [], instellingen: {},
  alsId: null, wedFilter: "gespeeld", screenshots: [], urls: {}, voorstel: null,
};

// ---------------------------------------------------------------------
// Hulpjes
// ---------------------------------------------------------------------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const euroFmt = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
const euro = n => euroFmt.format(Number(n) || 0);
const centen = n => Math.round((Number(n) || 0) * 100);
const leesBedrag = s => {
  const t = String(s ?? "").replace(/[€\s]/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".");
  const n = Number(t);
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
};
const vandaag = () => new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Amsterdam" }).format(new Date());
const dt = d => new Date(d + "T12:00:00");
const datumKort = d => dt(d).toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short" });
const datumLang = d => dt(d).toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const tijd = t => t ? String(t).slice(0, 5) : "";

function toast(tekst) {
  const t = $("#toast");
  t.textContent = tekst;
  t.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.style.display = "none"), 3500);
}
function fout(e, wat) {
  console.error(e);
  // Geweigerd door de database? Misschien is er inmiddels een code nodig.
  if (/row-level security|permission denied/i.test(e?.message || "")) {
    controleerCode().then(nodig => { if (!nodig) toast(`${wat} lukte niet: je hebt hier geen rechten voor.`); });
    return;
  }
  const m = e?.message || String(e);
  toast(`${wat} lukte niet: ${m}`);
}
function titel(tekst, terug) {
  $("#titel").textContent = tekst;
  const k = $("#terug");
  k.hidden = !terug;
  k.onclick = () => (location.hash = terug);
}
const deelnemer = id => S.deelnemers.find(d => d.id === id);
const kleur = id => {
  const i = S.deelnemers.findIndex(d => d.id === id);
  return KLEUREN[(i < 0 ? 0 : i) % KLEUREN.length];
};
const letters = id => (deelnemer(id)?.naam || "?").slice(0, 2);
// Profielfoto, of anders de eerste letters in de eigen kleur
function avatar(id, px = 30) {
  const d = deelnemer(id);
  const u = d?.foto_pad ? urlVan("profielfotos", d.foto_pad) : null;
  const st = `width:${px}px;height:${px}px;font-size:${Math.round(px * 0.42)}px;background:${kleur(id)}`;
  return u
    ? `<img class="avatar" src="${esc(u)}" alt="" style="width:${px}px;height:${px}px">`
    : `<span class="letters" style="${st}" aria-hidden="true">${esc(letters(id))}</span>`;
}
const isBeheerder = () => !!S.ik?.is_beheerder;

// ---------------------------------------------------------------------
// Gegevens laden
// ---------------------------------------------------------------------
async function laad() {
  const r = await Promise.all([
    sb.from("deelnemers").select("id, naam, user_id, inleg, is_beheerder, volgorde, actief, created_at, foto_pad").order("volgorde").order("naam"),
    sb.from("v_saldo_deelnemers").select("*"),
    sb.from("v_wedstrijden").select("*").order("datum").order("aanvang", { nullsFirst: false }),
    sb.from("v_pot").select("*").single(),
    sb.from("transacties").select("*").order("datum").order("tijd", { nullsFirst: true }).order("created_at"),
    sb.from("transactie_regels").select("*").order("volgorde"),
    sb.from("claims").select("*").order("created_at"),
    sb.from("betalingen").select("*").order("datum", { ascending: false }).order("created_at", { ascending: false }),
    sb.from("instellingen").select("*"),
    sb.from("screenshots").select("*").order("created_at"),
  ]);
  const mis = r.find(x => x.error);
  if (mis) throw mis.error;
  [S.deelnemers, S.saldo, S.wedstrijden, S.pot, S.transacties, S.regels, S.claims, S.betalingen] = r.slice(0, 8).map(x => x.data);
  S.instellingen = Object.fromEntries(r[8].data.map(i => [i.sleutel, i.waarde]));
  S.screenshots = r[9].data;
  const fotos = S.deelnemers.map(d => d.foto_pad).filter(Boolean);
  if (fotos.length) await urlsVoor(fotos, "profielfotos", true);
  S.ik = S.deelnemers.find(d => d.user_id === S.user.id) || null;
  S.niets = new Set();
  if (S.ik) {
    const { data: n } = await sb.from("niets_gehad").select("wedstrijd_id").eq("deelnemer_id", S.ik.id);
    (n || []).forEach(x => S.niets.add(x.wedstrijd_id));
  }
  if (!S.alsId || !deelnemer(S.alsId)) S.alsId = S.ik?.id || null;
  zetIcoonGetal();
  if (S.ik && !$("#menuknop").hidden) { $("#kopAvatar").innerHTML = avatar(S.ik.id, 34); $("#kopAvatar").hidden = false; }
  S.metMfa = new Set();
  S.laatst = {};
  if (S.ik?.is_beheerder) {
    const { data, error } = await sb.rpc("beheer_accounts");
    if (!error && Array.isArray(data)) {
      data.forEach(a => {
        if (a.tweestap) S.metMfa.add(a.deelnemer_id);
        S.laatst[a.deelnemer_id] = a.laatst_ingelogd;
        const d = S.deelnemers.find(x => x.id === a.deelnemer_id);
        if (d && "email" in a) d.email = a.email;
      });
      // Oudere database zonder e-mail in beheer_accounts: rechtstreeks ophalen
      if (data.length && !("email" in data[0])) {
        const { data: m } = await sb.from("deelnemers").select("id, email");
        (m || []).forEach(x => { const d = S.deelnemers.find(y => y.id === x.id); if (d) d.email = x.email; });
      }
    } else {
      const { data: m } = await sb.rpc("deelnemers_met_mfa");
      S.metMfa = new Set((m || []).map(x => (typeof x === "string" ? x : Object.values(x)[0])));
    }
  }
}
function verbergNavigatie() {
  $("#tabs").hidden = true;
  $("#menuknop").hidden = true;
  $("#kopAvatar").hidden = true;
  window.onhashchange = null;
}

// ---------------------------------------------------------------------
// Tweestapsverificatie
// ---------------------------------------------------------------------
const codeVeld = id => `<input id="${id}" class="codeveld" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" placeholder="123456" aria-label="Code van 6 cijfers">`;

async function mfaFactoren() {
  const { data } = await sb.auth.mfa.listFactors();
  const alle = data?.all || [];
  return {
    actief: alle.filter(f => f.factor_type === "totp" && f.status === "verified"),
    half: alle.filter(f => f.status !== "verified"),
  };
}

function toonMfaCode() {
  verbergNavigatie();
  titel("Vestekaart");
  scherm().innerHTML = `
    <form class="vlak" id="mfaForm">
      <h2>Tweestapsverificatie</h2>
      <p class="muted">Vul de code van 6 cijfers in uit je authenticator-app, bijvoorbeeld de app Wachtwoorden op je iPhone.</p>
      ${codeVeld("mfaCode")}
      <button class="knop">Bevestigen</button>
      <button type="button" class="tekstknop" id="mfaUit">Uitloggen</button>
      <p class="klein muted">Telefoon kwijt? Vraag Mike om je tweestapsverificatie uit te zetten.</p>
    </form>`;
  $("#mfaCode").focus();
  $("#mfaUit").onclick = () => sb.auth.signOut();
  $("#mfaForm").onsubmit = async e => {
    e.preventDefault();
    const code = $("#mfaCode").value.replace(/\D/g, "");
    if (code.length !== 6) return toast("Vul de 6 cijfers in.");
    const { actief } = await mfaFactoren();
    if (!actief.length) return toast("Geen authenticator gevonden. Vraag Mike om hulp.");
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: actief[0].id, code });
    if (error) { $("#mfaCode").select(); return toast("Deze code klopt niet of is verlopen. Probeer de nieuwste code."); }
    const { data: { session } } = await sb.auth.getSession();
    naInloggen(session.user);
  };
}

async function toonMfaInstellen(verplicht) {
  if (verplicht) verbergNavigatie();
  titel("Tweestapsverificatie", verplicht ? null : "profiel");
  scherm().innerHTML = `<p class="muted">Voorbereiden…</p>`;
  const { actief, half } = await mfaFactoren();
  for (const f of half) await sb.auth.mfa.unenroll({ factorId: f.id });
  if (actief.length) { toast("Tweestapsverificatie staat al aan"); location.hash = "profiel"; return; }
  const { data, error } = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: "Vestekaart " + Date.now(), issuer: "Vestekaart" });
  if (error) {
    scherm().innerHTML = `<div class="vlak"><p>Instellen lukte niet: ${esc(error.message)}</p>
      <button class="knop licht" id="mfaUit">Uitloggen</button></div>`;
    $("#mfaUit").onclick = () => sb.auth.signOut();
    return;
  }
  const t = data.totp;
  scherm().innerHTML = `
    <form class="vlak" id="mfaSetup">
      <h2>Tweestapsverificatie instellen</h2>
      ${verplicht ? `<div class="status let">Als beheerder is tweestapsverificatie verplicht. Stel het eenmalig in om verder te gaan.</div>` : ""}
      <p><b>1. Op je iPhone:</b> tik op <a href="${esc(t.uri)}">Toevoegen aan authenticator</a>. De app Wachtwoorden opent en bewaart de code.</p>
      <p class="klein muted">Op een computer: scan de QR-code met de camera van je telefoon of met je authenticator-app.</p>
      <img src="${esc(t.qr_code)}" alt="QR-code voor tweestapsverificatie" class="qr">
      <p class="klein muted">Lukt scannen niet? Vul deze sleutel handmatig in:<br><code class="sleutel">${esc(t.secret)}</code></p>
      <p><b>2. Vul de code van 6 cijfers in</b> die je authenticator nu laat zien:</p>
      ${codeVeld("setupCode")}
      <button class="knop">Tweestapsverificatie aanzetten</button>
      ${verplicht ? `<button type="button" class="tekstknop" id="mfaUit">Uitloggen</button>` : ""}
    </form>`;
  $("#mfaUit")?.addEventListener("click", () => sb.auth.signOut());
  $("#mfaSetup").onsubmit = async e => {
    e.preventDefault();
    const code = $("#setupCode").value.replace(/\D/g, "");
    if (code.length !== 6) return toast("Vul de 6 cijfers in.");
    const { error: e2 } = await sb.auth.mfa.challengeAndVerify({ factorId: data.id, code });
    if (e2) { $("#setupCode").select(); return toast("Deze code klopt niet. Probeer de nieuwste code."); }
    toast("Tweestapsverificatie staat aan");
    const { data: { session } } = await sb.auth.getSession();
    location.hash = verplicht ? "home" : "profiel";
    naInloggen(session.user);
  };
}

// Weergave: automatisch, licht of donker, per apparaat bewaard
function themaNu() { return document.documentElement.dataset.thema || "auto"; }

  if (t === "licht" || t === "donker") document.documentElement.dataset.thema = t;

}
// Shirtkeuze: eenvoudige shirtjes met de kleuren en het patroon van elk thema
const SHIRT_VORM = "M31 12 L41 7 Q50 15 59 7 L69 12 L93 26 L85 45 L74 40 L74 95 L26 95 L26 40 L15 45 L7 26 Z";
function shirtSvg(k) {

  const binnen = {

      ${[0, 26, 52, 78].map(v => `<rect y="${v}" width="100" height="8" fill="#22785C" opacity=".75"/><rect x="${v}" width="8" height="100" fill="#22785C" opacity=".75"/>`).join("")}
      ${[18, 44, 70, 96].map(v => `<rect y="${v}" width="100" height="1.6" fill="#9FB0E0" opacity=".55"/><rect x="${v}" width="1.6" height="100" fill="#9FB0E0" opacity=".55"/>`).join("")}

function teDoenAantal() {
  if (!S.ik) return 0;
  const nu = vandaag();
  return S.wedstrijden.filter(w => w.datum <= nu && Number(w.open) > 0 && bedragBij(w.id, S.ik.id) === 0 && !hadNiets(w.id)).length;
}
function zetIcoonGetal() {
  try {
    if (!("setAppBadge" in navigator) || !("Notification" in window) || Notification.permission !== "granted") return;
    const n = teDoenAantal();
    (n > 0 ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
  } catch { /* niet ondersteund */ }
}
const pushKan = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const opBeginscherm = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function b64uNaarSleutel(t) {
  const s = t.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - (t.length % 4)) % 4);
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}
// Wacht op de service worker, maar niet eindeloos
async function swKlaar() {
  if (!pushKan()) return null;
  return Promise.race([navigator.serviceWorker.ready, new Promise(ok => setTimeout(() => ok(null), 5000))]);
}
async function mijnAbonnement() {
  const reg = await swKlaar();
  return reg ? reg.pushManager.getSubscription() : null;
}
async function registreerAbonnement(ab) {
  const j = ab.toJSON();
  const { error } = await sb.rpc("registreer_push", {
    p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_apparaat: navigator.userAgent,
  });
  if (error) throw error;
}
// Bij het opstarten: staat dit apparaat aangemeld, houd de database dan bij
async function controleerAbonnement() {
  try {
    if (!pushKan() || Notification.permission !== "granted") return;
    const ab = await mijnAbonnement();
    if (ab) await registreerAbonnement(ab);
  } catch { /* niet erg */ }
}

async function meldingenBlok(el) {
  const kop = ``;
  if (!pushKan() || (isIOS() && !opBeginscherm())) {
    el.innerHTML = `${kop}<p class="klein muted">${isIOS()
      ? "Meldingen en het getal op het icoon werken alleen als je de Vestekaart opent via het icoon op je beginscherm. Zet de app eerst op je beginscherm (Safari, Delen, Zet op beginscherm) en open hem daarvandaan."
      : "Deze browser ondersteunt geen meldingen."}</p>`;
    return;
  }
  if (Notification.permission === "denied") {
    el.innerHTML = `${kop}<p class="klein muted">Meldingen zijn geblokkeerd. Zet ze aan in de instellingen van je telefoon: Instellingen, Berichtgeving, Vestekaart.</p>`;
    return;
  }
  const ab = Notification.permission === "granted" ? await mijnAbonnement() : null;
  if (!ab) {
    el.innerHTML = `${kop}
      <p class="klein muted">Krijg een melding zodra je kunt invullen wat je had, en een herinnering de avond voor een thuiswedstrijd als je nog iets open hebt staan. Het icoon laat dan ook zien hoeveel wedstrijden je nog kunt invullen.</p>
      <button type="button" class="knop" id="pushAan" style="justify-self:start">Meldingen aanzetten</button>`;
    $("#pushAan").onclick = async () => {
      try {
        const toestemming = await Notification.requestPermission();
        if (toestemming !== "granted") return meldingenBlok(el);
        const reg = await swKlaar();
        if (!reg) throw new Error("De app is nog niet klaar voor meldingen. Sluit de app af en open hem opnieuw.");
        const nieuw = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uNaarSleutel(VAPID_PUBLIEK) });
        await registreerAbonnement(nieuw);
        zetIcoonGetal();
        toast("Meldingen staan aan");
        meldingenBlok(el);
      } catch (err) { fout(err, "Meldingen aanzetten"); }
    };
    return;
  }
  const { data: vk } = await sb.from("meldingvoorkeuren").select("*").eq("deelnemer_id", S.ik.id).maybeSingle();
  const v = vk || { inlezen: true, herinnering: true, betaling: true };
  const soorten = [["inlezen", "Aankopen ingelezen: geef aan wat je had"], ["herinnering", "Herinnering de avond voor een thuiswedstrijd, als je nog iets open hebt"]];
  if (isBeheerder()) soorten.push(["betaling", "Iemand heeft een betaling doorgegeven"]);
  el.innerHTML = `${kop}
    <div class="status goed">Meldingen staan aan op dit apparaat.</div>
    <div class="stapel" style="gap:10px">${soorten.map(([k, l]) => `<label class="knoppen" style="flex-wrap:nowrap;align-items:flex-start">
      <input type="checkbox" data-vk="${k}" ${v[k] !== false ? "checked" : ""} style="width:22px;height:22px;min-height:0;flex:none;accent-color:var(--rood)"> <span>${l}</span></label>`).join("")}</div>
    <p class="klein muted">Alleen het getal op het icoon, zonder meldingen op je scherm? Zet dan op je iPhone onder Instellingen, Berichtgeving, Vestekaart de Banners en Geluiden uit, en laat Badges aan.</p>
    <div class="knoppen">
      <button type="button" class="knop licht" id="pushTest">Testmelding sturen</button>
      <button type="button" class="tekstknop" id="pushUit">Uitzetten op dit apparaat</button>
    </div>`;
  el.querySelectorAll("[data-vk]").forEach(c => (c.onchange = async () => {
    const { error } = await sb.from("meldingvoorkeuren").upsert({ deelnemer_id: S.ik.id, [c.dataset.vk]: c.checked });
    if (error) { c.checked = !c.checked; return fout(error, "Opslaan"); }
    toast("Opgeslagen");
  }));
  $("#pushTest").onclick = async () => {
    try {
      const r = await roepFunctie("meldingen", { soort: "test" });
      toast(r.verstuurd ? "Testmelding verstuurd" : "Er is geen melding verstuurd. Zet meldingen uit en weer aan.");
    } catch (err) { fout(err, "Testmelding"); }
  };
  $("#pushUit").onclick = async () => {
    try {
      await sb.rpc("afmelden_push", { p_endpoint: ab.endpoint });
      await ab.unsubscribe();
      toast("Meldingen staan uit op dit apparaat");
      meldingenBlok(el);
    } catch (err) { fout(err, "Uitzetten"); }
  };
}

// Vraagt de code als dit apparaat die (inmiddels) nodig heeft
async function controleerCode() {
  if (!S.user) return false;
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();

  return false;
}

async function start() {
  sb.auth.onAuthStateChange((ev, sessie) => {
    S.token = sessie?.access_token || null;
    if (ev === "SIGNED_OUT") { S.user = null; S.ik = null; $("#menuknop").hidden = true; $("#kopAvatar").hidden = true; sluitMenu(); toonInloggen(); }
  });
  const { data: { session } } = await sb.auth.getSession();
  S.token = session?.access_token || null;
  if (session) await naInloggen(session.user);
  else toonInloggen();
}

async function naInloggen(user) {
  S.user = user;
  try {
    // Tweestapsverificatie: eerst de code, of (beheerder) eerst instellen
    const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    S.aal = aal?.currentLevel || "aal1";
    if (aal && aal.nextLevel === "aal2" && aal.currentLevel !== "aal2") return toonMfaCode();
    await sb.rpc("koppel_mij");
    const { data: st } = await sb.rpc("mijn_status");
    if (st?.is_beheerder && S.aal !== "aal2") return toonMfaInstellen(true);
    await laad();
  } catch (e) {
    scherm().innerHTML = `<div class="vlak"><p>De gegevens konden niet worden geladen: ${esc(e.message || e)}</p>
      <button class="knop" onclick="location.reload()">Opnieuw proberen</button></div>`;
    return;
  }
  if (!S.ik) {
    titel("Vestekaart");
    scherm().innerHTML = `<div class="vlak"><h3>Account niet gekoppeld</h3>
      <p>Je bent ingelogd als ${esc(user.email)}, maar dit adres hoort niet bij een deelnemer. Vraag Mike om je e-mailadres in Beheer te zetten.</p>
      <button class="knop licht" id="uit">Uitloggen</button></div>`;
    $("#uit").onclick = () => sb.auth.signOut();
    return;
  }
  bouwTabs();
  setTimeout(controleerTikkieBetaling, 500);
  $("#menuknop").hidden = false;
  $("#kopAvatar").innerHTML = avatar(S.ik.id, 34);
  $("#kopAvatar").hidden = false;
  controleerAbonnement();
  window.onhashchange = route;
  route();
}

function authFout(e) {
  const m = e?.message || "";
  if (/database error|niet bij een deelnemer/i.test(m)) return "Dit e-mailadres hoort niet bij een deelnemer. Vraag Mike om een uitnodiging.";
  if (/invalid login/i.test(m)) return "E-mailadres of wachtwoord klopt niet.";
  if (/already registered|already been registered/i.test(m)) return "Er bestaat al een account met dit e-mailadres. Kies Inloggen.";
  if (/password/i.test(m)) return "Kies een wachtwoord van minstens 8 tekens.";
  return "Dat lukte niet: " + m;
}

function toonInloggen(modus = "inloggen") {
  $("#tabs").hidden = true;
  titel("Vestekaart");
  window.onhashchange = null;
  scherm().innerHTML = `
    <section class="welkom">
      <div class="kaart" style="padding-bottom:14px">
        <img class="ros" src="${ROS}" alt="">
        <div class="kop">Vestekaart</div>
        <div class="saldo" style="font-size:clamp(1.9rem, 9vw, 2.6rem)">Zes man, één kaart</div>
        <div class="sier">– Sinds 2008 –</div>
      </div>
      <div class="seg" role="tablist">
        <button type="button" data-modus="inloggen" class="${modus === "inloggen" ? "aan" : ""}">Inloggen</button>
        <button type="button" data-modus="account" class="${modus === "account" ? "aan" : ""}">Account maken</button>
      </div>
      <form id="authForm" class="vlak">
        ${modus === "account" ? `<p class="muted klein">Gebruik het e-mailadres waarop je de uitnodiging kreeg.</p>` : ""}
        <label class="veld"><span>E-mailadres</span><input name="email" type="email" required autocomplete="email"></label>
        <label class="veld"><span>Wachtwoord${modus === "account" ? " (minstens 8 tekens)" : ""}</span>
          <input name="pw" type="password" required minlength="${modus === "account" ? 8 : 1}" autocomplete="${modus === "account" ? "new-password" : "current-password"}"></label>
        <button class="knop">${modus === "account" ? "Account maken" : "Inloggen"}</button>
      </form>
    </section>`;
  scherm().querySelectorAll("[data-modus]").forEach(b => (b.onclick = () => toonInloggen(b.dataset.modus)));
  $("#authForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const email = String(f.get("email")).trim().toLowerCase();
    const password = String(f.get("pw"));
    const knop = e.target.querySelector("button");
    knop.disabled = true;
    const { data, error } = modus === "account"
      ? await sb.auth.signUp({ email, password })
      : await sb.auth.signInWithPassword({ email, password });
    knop.disabled = false;
    if (error) return toast(authFout(error));
    if (data.session) naInloggen(data.session.user);
    else toast("Account gemaakt. Log nu in.");
  };
}

}

function route() {
  if (!S.ik) return;
  const [pad, arg] = (location.hash.slice(1) || "home").split("/");
  if (S.vorigeHash !== location.hash) window.scrollTo(0, 0);
  S.vorigeHash = location.hash;
  if (pad === "wedstrijd" && arg) { markeerTab("wedstrijden"); return toonWedstrijd(arg); }
  if (pad === "wedstrijden") { markeerTab("wedstrijden"); return toonWedstrijden(); }
  if (pad === "mijn") {
    markeerTab("mijn");
    toonMijn();
    if (arg === "betalen") $("#betaalBlok")?.scrollIntoView({ block: "start" });
    return;
  }
  if (pad === "profiel") { markeerTab("profiel"); return toonProfiel(); }
  if (pad === "tweestap") { markeerTab("profiel"); return toonMfaInstellen(false); }
  if (pad === "inlezen" && arg && isBeheerder()) { markeerTab("wedstrijden"); return toonInlezen(arg); }
  if (pad === "verwerken" && arg && isBeheerder()) { markeerTab("beheer"); return toonVerwerken(arg); }
  if (pad === "beheer" && isBeheerder()) { markeerTab("beheer"); return toonBeheer(arg || "deelnemers"); }
  if (pad === "pot") { markeerTab("pot"); return toonPot(); }
  markeerTab("home");
  toonHome();
}

function ticket(w) {
  const d = dt(w.datum);
  const gespeeld = w.datum < vandaag();
  const rechts = Number(w.kosten) > 0
    ? `<span class="getal">${euro(w.kosten)}</span>${Number(w.open) > 0 ? `<br><span class="klein open">${euro(w.open)} open</span>` : ""}`
    : gespeeld ? `<span class="klein muted">geen kosten</span>`
    : `<span class="klein muted">${w.datum_voorlopig ? "datum voorlopig" : tijd(w.aanvang)}</span>`;
  return `<a class="ticket" href="#wedstrijd/${w.id}">
    <div class="dag"><b>${d.getDate()}</b><span>${d.toLocaleDateString("nl-NL", { month: "short" })}</span></div>
    <div class="wie"><b>${esc(w.tegenstander)}</b><span class="klein muted">${esc(w.competitie || "")}</span></div>
    <div class="bedrag">${rechts}</div></a>`;
}

// Wat iemand bij een wedstrijd heeft geclaimd
function bedragBij(wedId, deelnemerId) {
  const tids = new Set(S.transacties.filter(t => t.wedstrijd_id === wedId).map(t => t.id));
  return S.claims.filter(c => c.deelnemer_id === deelnemerId && tids.has(c.transactie_id)).reduce((a, c) => a + Number(c.bedrag), 0);
}

const seizoen = () => S.instellingen.seizoen ? `Seizoen ’${S.instellingen.seizoen}` : "";
function kaartHtml() {
  const p = S.pot || {};
  return `<div class="kaart">
      ${seizoen() ? `<div class="hoek">${seizoen()}</div>` : ""}
      <img class="ros" src="${ROS}" alt="">
      <div class="kop">Vestekaart</div>
      <div class="saldo" aria-label="Saldo op de Vestekaart">${euro(p.saldo_kaart)}</div>
      <div class="sier">– Sinds 2008 –</div>
      <div class="onder">
        <span>Op de rekening<b>${euro(p.saldo_rekening)}</b></span>
        <span class="rechts">Samen<b>${euro(p.saldo_totaal)}</b></span>
      </div>
    </div>`;
}

// Waarschuwing voor de beheerder over de Tikkie-link. Alleen nodig als iemand nog
// iets open heeft staan, en weg te klikken tot er een andere link wordt opgeslagen.
const tikkieSleutel = t => `${t.link}|${t.tot}`;
function tikkieWaarschuwing() {
  const t = tikkie();
  const iemandOpen = S.saldo.some(x => x.actief && centen(x.openstaand) > 0);
  if (!iemandOpen || S.instellingen.tikkie_melding_weg === tikkieSleutel(t)) return "";
  let tekst = "";
  if (!t.link) tekst = "Er is nog geen Tikkie ingesteld.";
  else if (!t.geldig) tekst = "Je Tikkie is verlopen.";
  else if (t.dagen !== null && t.dagen <= 3) tekst = `Je Tikkie verloopt ${t.dagen === 0 ? "vandaag" : `over ${t.dagen} ${t.dagen === 1 ? "dag" : "dagen"}`}.`;
  if (!tekst) return "";
  return `<div class="status let melding-weg">
      <a href="#beheer/betalingen" style="text-decoration:none;color:inherit">${tekst} Tik hier om een nieuwe link te plakken.</a>
      <button type="button" class="weg-knop" id="tikkieWeg" aria-label="Melding wegklikken">×</button>
    </div>`;
}
async function tikkieWaarschuwingWeg() {
  const { error } = await sb.from("instellingen").upsert({ sleutel: "tikkie_melding_weg", waarde: tikkieSleutel(tikkie()) });
  if (error) return fout(error, "Wegklikken");
  toast("Melding weggeklikt. Hij komt terug als je een nieuwe link opslaat.");
  verversEnToon();
}

function toonHome() {

    .filter(w => w.datum <= nu && Number(w.open) > 0)

      <div class="wie"><b>${esc(w.tegenstander)}</b><span class="klein muted">${mijn > 0 ? `Nog ${euro(w.open)} niet verdeeld` : `Kosten ${euro(w.kosten)}`}</span></div>
      <div class="bedrag">${mijn > 0

          <span class="knop" style="justify-self:start;margin-top:6px">Betalen</span></a>`

function toonPot() {

      <span class="groei">${esc(d.naam)}<br><span class="klein muted">verbruikt ${euro(s.verbruikt)}</span></span>
      <span class="rechts">${Number(s.openstaand) > 0
        ? `<span class="getal open">${euro(s.openstaand)}</span><br><span class="klein muted">over te maken</span>`

  }).join("");

    ${kaartHtml()}
    ${compleet
      ? `<div class="status goed">De pot is compleet: kaart en rekening zijn samen precies de inleg van ${euro(inleg)} van de actieve deelnemers.</div>`
      : `<div class="status let">${centen(p.niet_geclaimd) > 0 ? `Er is nog ${euro(p.niet_geclaimd)} niet verdeeld. ` : ""}${centen(p.nog_over_te_maken) > 0 ? `Er moet nog ${euro(p.nog_over_te_maken)} worden overgemaakt. ` : ""}Daarna is de pot weer ${euro(inleg)}.</div>`}

function toonWedstrijden() {
  titel(`Wedstrijden${S.instellingen.seizoen ? ` ’${S.instellingen.seizoen}` : ""}`);
  const nu = vandaag();
  const gespeeld = S.wedstrijden.filter(w => w.datum < nu).reverse();
  const komend = S.wedstrijden.filter(w => w.datum >= nu);
  const lijst = S.wedFilter === "komend" ? komend : gespeeld;
  scherm().innerHTML = `
    <div class="seg">
      <button data-f="gespeeld" class="${S.wedFilter === "gespeeld" ? "aan" : ""}">Gespeeld (${gespeeld.length})</button>
      <button data-f="komend" class="${S.wedFilter === "komend" ? "aan" : ""}">Komend (${komend.length})</button>
    </div>
    <div class="tickets">${lijst.map(ticket).join("") || `<p class="leeg muted">Geen wedstrijden.</p>`}</div>`;
  scherm().querySelectorAll("[data-f]").forEach(b => (b.onclick = () => { S.wedFilter = b.dataset.f; toonWedstrijden(); }));
}

function verdelingBalk(t, claims) {
  const totaal = Number(t.bedrag);
  const perPersoon = {};
  claims.forEach(c => (perPersoon[c.deelnemer_id] = (perPersoon[c.deelnemer_id] || 0) + Number(c.bedrag)));
  return `<div class="verdeling" aria-hidden="true">${Object.entries(perPersoon)
    .map(([id, b]) => `<span style="width:${(b / totaal) * 100}%;background:${kleur(id)}"></span>`).join("")}</div>`;
}

function chip(c, magWeg) {
  const d = deelnemer(c.deelnemer_id);
  return `<span class="chip ${magWeg ? "" : "zonder"}" style="background:${kleur(c.deelnemer_id)}">${esc(d?.naam || "?")}${c.regel_id ? "" : ` ${euro(c.bedrag)}`}${
    magWeg ? `<button data-weg="${c.id}" aria-label="Claim van ${esc(d?.naam)} weghalen">×</button>` : ""}</span>`;
}

function toonWedstrijd(id) {
  const w = S.wedstrijden.find(x => x.id === id);
  if (!w) { location.hash = "wedstrijden"; return; }
  titel(w.tegenstander, "home");
  const als = deelnemer(S.alsId) || S.ik;
  const ikZelf = als.id === S.ik.id;
  const aankopen = S.transacties.filter(t => t.wedstrijd_id === id && t.soort === "aankoop");
  const tids = new Set(aankopen.map(t => t.id));
  const regels = S.regels.filter(r => tids.has(r.transactie_id));
  const claims = S.claims.filter(c => tids.has(c.transactie_id));
  const opRegel = new Map(claims.filter(c => c.regel_id).map(c => [c.regel_id, c]));
  const mijnTotaal = claims.filter(c => c.deelnemer_id === als.id).reduce((a, c) => a + Number(c.bedrag), 0);
  const magWeg = c => isBeheerder() || c.deelnemer_id === S.ik.id;

  // Artikelen van alle aankopen samen, per soort
  const groepen = [];
  for (const r of regels) {
    const k = `${r.omschrijving.trim().toLowerCase()}|${centen(r.bedrag)}`;
    let g = groepen.find(x => x.k === k);
    if (!g) groepen.push(g = { k, naam: r.omschrijving.trim(), prijs: Number(r.bedrag), regels: [] });
    g.regels.push(r);
  }
  groepen.forEach(g => {
    g.vrij = g.regels.filter(r => !opRegel.has(r.id));
    g.mijn = g.regels.filter(r => opRegel.get(r.id)?.deelnemer_id === als.id);
    const anderen = {};
    g.regels.forEach(r => { const c = opRegel.get(r.id); if (c && c.deelnemer_id !== als.id) anderen[c.deelnemer_id] = (anderen[c.deelnemer_id] || 0) + 1; });
    g.anderen = anderen;
  });
  groepen.sort((a, b) => b.regels.length - a.regels.length || a.naam.localeCompare(b.naam));

  // Aankopen (of resten) die je alleen met een bedrag kunt claimen
  const losseBonnen = aankopen.map(t => {
    const tr = regels.filter(r => r.transactie_id === t.id);
    const tc = claims.filter(c => c.transactie_id === t.id);
    const vrij = Number(t.bedrag) - tc.reduce((a, c) => a + Number(c.bedrag), 0);
    const regelVrij = tr.filter(r => !opRegel.has(r.id)).reduce((a, r) => a + Number(r.bedrag), 0);
    const zonderArt = vrij - regelVrij;
    return { t, tc, vrij, zonderArt, heeftRegels: tr.length > 0 };
  }).filter(x => !x.heeftRegels || centen(x.zonderArt) > 0 || x.tc.some(c => !c.regel_id));

  const itemsHtml = groepen.map(g => `
    <div class="item">
      <div class="groei">
        <span class="naam">${esc(g.naam)}</span>
        <span class="klein muted">${euro(g.prijs)}, nog ${g.vrij.length} van ${g.regels.length} over</span>
        ${Object.keys(g.anderen).length ? `<span>${Object.entries(g.anderen).map(([did, n]) =>
          `<span class="mini">${avatar(did, 18)}${esc(deelnemer(did)?.naam)} ${n}</span>`).join("")}</span>` : ""}
      </div>
      <div class="stepper">
        <button type="button" data-min="${esc(g.k)}" ${g.mijn.length ? "" : "disabled"} aria-label="Eén ${esc(g.naam)} minder">−</button>
        <span class="aantal" aria-label="Aantal">${g.mijn.length}</span>
        <button type="button" class="plus" data-plus="${esc(g.k)}" ${g.vrij.length ? "" : "disabled"} aria-label="Eén ${esc(g.naam)} meer">+</button>
      </div>
    </div>`).join("");

  const losHtml = losseBonnen.map(({ t, tc, vrij, zonderArt, heeftRegels }) => {
    const losseClaims = tc.filter(c => !c.regel_id);
    const naam = t.bron === "spreadsheet" ? "Totaal uit de spreadsheet" : (t.kassa || "Aankoop");
    const max = heeftRegels ? zonderArt : vrij;
    return `<article class="bon">
      <div class="bon-kop"><span class="klein muted">${esc(naam)}${t.tijd ? `, ${tijd(t.tijd)}` : ""}</span><b class="getal">${euro(t.bedrag)}</b></div>
      ${verdelingBalk(t, tc)}
      ${losseClaims.length ? `<div class="chips">${losseClaims.map(c => chip(c, magWeg(c))).join("")}</div>` : ""}
      ${centen(max) > 0 ? `<form class="claimrij" data-claim="${t.id}" data-max="${max.toFixed(2)}">
          <label class="veld"><span>Nog vrij: ${euro(max)}</span><input name="bedrag" inputmode="decimal" placeholder="Jouw bedrag" required></label>
          <button class="knop">Claimen</button>
          <button type="button" class="knop licht" data-rest="${t.id}" data-vrij="${max.toFixed(2)}">Alles</button>
        </form>` : `<span class="klein muted">Helemaal verdeeld.</span>`}
    </article>`;
  }).join("");

  scherm().innerHTML = `
    <div class="vlak">
      <div><h2>FC Twente – ${esc(w.tegenstander)}</h2>
        <span class="muted">${datumLang(w.datum)}${w.aanvang ? `, ${tijd(w.aanvang)}` : ""}${w.datum_voorlopig ? " (voorlopig)" : ""}</span></div>
      ${isBeheerder() && aankopen.length ? `<label class="veld"><span>Invullen voor</span>
        <select id="als">${S.deelnemers.filter(d => d.actief).map(d => `<option value="${d.id}" ${d.id === als.id ? "selected" : ""}>${esc(d.naam)}</option>`).join("")}</select></label>` : ""}
      ${aankopen.length ? `<div class="jouw">
        <span><span class="klein muted">${ikZelf ? "Jouw bedrag" : `Bedrag van ${esc(als.naam)}`}</span><br><span class="groot">${euro(mijnTotaal)}</span></span>
        <span class="rechts klein muted">Kosten ${euro(w.kosten)}<br>${Number(w.open) > 0 ? `<span class="open">nog ${euro(w.open)} niet verdeeld</span>` : "alles verdeeld"}</span>
      </div>` : ""}
    </div>
    ${groepen.length ? `<div class="vlak"><h3>${ikZelf ? "Wat had je?" : `Wat had ${esc(als.naam)}?`}</h3><div>${itemsHtml}</div></div>` : ""}
    ${losHtml ? `<div class="stapel">${groepen.length ? `<h3>Aankopen zonder artikellijst</h3>` : ""}${losHtml}</div>` : ""}
    ${!aankopen.length ? `<div class="vlak leeg"><p class="muted">${w.datum > vandaag() ? "Deze wedstrijd moet nog gespeeld worden." : "Er zijn nog geen aankopen bij deze wedstrijd ingelezen."}</p></div>` : ""}
    ${ikZelf && aankopen.length && mijnTotaal === 0 && Number(w.open) > 0 && !hadNiets(id)
      ? `<button type="button" class="tekstknop" id="niets" style="justify-self:center">Ik had niets bij deze wedstrijd</button>` : ""}
    ${galerijHtml(id)}
    ${isBeheerder() ? `
      ${(() => {
        const ov = onverwerkteShots(id);
        if (!ov.length) return "";
        const ongelezen = ov.filter(x => !x.uitgelezen).length;
        return `<div class="status let">${ov.length === 1 ? "Er is 1 screenshot" : `Er zijn ${ov.length} screenshots`} nog niet verwerkt${ongelezen ? `, waarvan ${ongelezen} nog niet uitgelezen` : ""}.
          <div style="margin-top:8px"><a class="knop" href="#verwerken/${id}" style="text-decoration:none;display:inline-block">Voorstel verwerken</a></div></div>`;
      })()}
      ${aankopen.length ? `<details class="alle"><summary>Alle aankopen bij deze wedstrijd (${aankopen.length})</summary>
        <ul class="lijst">${aankopen.map(t => `<li><span class="groei">${esc(t.kassa || (t.bron === "spreadsheet" ? "Spreadsheet" : "Aankoop"))}<br>
          <span class="klein muted">${t.tijd ? tijd(t.tijd) + ", " : ""}${S.regels.filter(r => r.transactie_id === t.id).length} artikelen</span></span>
          <span class="getal">${euro(t.bedrag)}</span>
          <button class="knop klein licht" data-wegt="${t.id}" aria-label="Aankoop verwijderen">×</button></li>`).join("")}</ul></details>` : ""}
      ${w.datum <= vandaag() ? `<div class="knoppen"><a class="knop" href="#inlezen/${id}" style="text-decoration:none">Screenshots inlezen</a></div>` : ""}` : ""}`;
  vulPlaatjes(scherm());

  const sc = scherm();
  let bezig = false;
  const doe = async (fn, wat) => {
    if (bezig) return;
    bezig = true;
    sc.querySelectorAll(".stepper button").forEach(b => (b.disabled = true));
    const { error } = await fn();
    bezig = false;
    if (error) { fout(error, wat); }
    verversEnToon();
  };
  $("#als")?.addEventListener("change", e => { S.alsId = e.target.value; toonWedstrijd(id); });
  sc.querySelectorAll("[data-plus]").forEach(b => (b.onclick = () => {
    const g = groepen.find(x => x.k === b.dataset.plus);
    const r = g?.vrij[0];
    if (!r) return;
    doe(() => sb.from("claims").insert({ transactie_id: r.transactie_id, deelnemer_id: als.id, regel_id: r.id, bedrag: r.bedrag }), "Toevoegen");
  }));
  sc.querySelectorAll("[data-min]").forEach(b => (b.onclick = () => {
    const g = groepen.find(x => x.k === b.dataset.min);
    const r = g?.mijn[g.mijn.length - 1];
    if (!r) return;
    doe(() => sb.from("claims").delete().eq("id", opRegel.get(r.id).id), "Weghalen");
  }));
  sc.querySelectorAll("form[data-claim]").forEach(f => (f.onsubmit = e => {
    e.preventDefault();
    const bedrag = leesBedrag(new FormData(f).get("bedrag"));
    if (!(bedrag > 0)) return toast("Vul een bedrag in, bijvoorbeeld 5,90.");
    if (centen(bedrag) > centen(f.dataset.max)) return toast(`Er is nog maar ${euro(f.dataset.max)} vrij.`);
    doe(() => sb.from("claims").insert({ transactie_id: f.dataset.claim, deelnemer_id: als.id, bedrag }), "Claimen");
  }));
  sc.querySelectorAll("[data-rest]").forEach(b => (b.onclick = () =>
    doe(() => sb.from("claims").insert({ transactie_id: b.dataset.rest, deelnemer_id: als.id, bedrag: Number(b.dataset.vrij) }), "Claimen")));
  sc.querySelectorAll("[data-weg]").forEach(b => (b.onclick = () =>
    doe(() => sb.from("claims").delete().eq("id", b.dataset.weg), "Weghalen")));
  sc.querySelectorAll("[data-wegt]").forEach(b => (b.onclick = () => {
    if (!confirm("Deze aankoop en alle claims erop verwijderen?")) return;
    doe(() => sb.from("transacties").delete().eq("id", b.dataset.wegt), "Verwijderen");
  }));
  $("#niets")?.addEventListener("click", async () => {
    const { error } = await sb.from("niets_gehad").insert({ deelnemer_id: S.ik.id, wedstrijd_id: id });
    if (error) return fout(error, "Opslaan");
    toast("Genoteerd: niets bij deze wedstrijd");
    location.hash = "home";
    verversEnToon();
  });
}

// Betalen met Tikkie (één link van de beheerder; iedereen vult zelf zijn bedrag in)

function tikkie() {
  const link = (S.instellingen.tikkie_link || "").trim();
  const tot = S.instellingen.tikkie_tot || "";
  const geldig = !!link && (!tot || tot >= vandaag());
  const dagen = tot ? Math.round((dt(tot) - dt(vandaag())) / 86400000) : null;
  return { link, tot, geldig, dagen };
}
async function kopieer(tekst, wat) {
  try { await navigator.clipboard.writeText(tekst); toast(`${wat} gekopieerd`); return true; }
  catch { toast(`Kopiëren lukte niet. ${wat}: ${tekst}`); return false; }
}
const bedragTekst = n => Number(n).toFixed(2).replace(".", ",");
function betaalBlok(open) {
  const t = tikkie();
  const iban = (S.instellingen.iban || "").trim();
  const naam = (S.instellingen.rekening_naam || "").trim();
  const omschrijving = `Vestekaart ${S.ik.naam}`;
  return `<div class="vlak betaal" id="betaalBlok">
      <h3>Betalen</h3>
      <div class="betaal-bedrag"><span class="getal">${euro(open)}</span>
        <button type="button" class="knop klein licht" data-kopieer="${bedragTekst(open)}" data-wat="Bedrag">Kopieer bedrag</button></div>
      ${t.geldig
        ? `<a class="knop tikkie" id="tikkieKnop" href="${esc(t.link)}" target="_blank" rel="noopener">Betalen met Tikkie</a>
           <p class="klein muted">Hiermee wordt je betaling van ${euro(open)} meteen doorgegeven, en staat het bedrag klaar om in Tikkie te plakken. Lukte het betalen toch niet? Trek hem dan binnen 2 uur in onder Mijn betalingen.</p>`
        : `<p class="klein muted">Betalen met Tikkie kan op dit moment niet${t.link ? ", de link is verlopen" : ""}. Maak het bedrag over naar de rekening hieronder.</p>`}
      ${iban ? `<details class="rekening"><summary class="klein">Liever zelf overmaken?</summary>
        <ul class="lijst klein">
          <li><span class="groei">Rekening<br><b>${esc(iban)}</b>${naam ? `<br><span class="muted">${esc(naam)}</span>` : ""}</span>
            <button type="button" class="knop klein licht" data-kopieer="${esc(iban.replace(/\s/g, ""))}" data-wat="Rekeningnummer">Kopieer</button></li>
          <li><span class="groei">Omschrijving<br><b>${esc(omschrijving)}</b></span>
            <button type="button" class="knop klein licht" data-kopieer="${esc(omschrijving)}" data-wat="Omschrijving">Kopieer</button></li>
        </ul></details>` : ""}
      <div class="betaal-klaar">
        ${t.geldig ? "" : `<button type="button" class="knop" id="betaaldKnop">Ik heb ${euro(open)} betaald</button>`}
        ${t.geldig && iban ? `<button type="button" class="tekstknop" id="betaaldKnop">Zelf overgemaakt? Geef ${euro(open)} door</button>` : ""}
        <button type="button" class="tekstknop" id="anderBedrag">Ander bedrag doorgeven</button>
      </div>
    </div>`;
}
// Tikken op de Tikkie-knop = betaald. De betaling gaat meteen de deur uit, ook als de
// telefoon direct naar Tikkie overschakelt (keepalive). Lukt dat niet, dan wordt het bij
// terugkomen in de app alsnog doorgegeven. Intrekken kan 2 uur lang.
const TIKKIE_BEWAAR = "vestekaart-tikkie";
function tikkieGeklikt(open) {
  if (S.tikkieBezig) return;
  S.tikkieBezig = true;
  const bedrag = Math.round(open * 100) / 100;
  try { navigator.clipboard.writeText(bedragTekst(open)); } catch { /* geen klembord */ }
  try { localStorage.setItem(TIKKIE_BEWAAR, JSON.stringify({ wie: S.ik.id, bedrag, moment: new Date().toISOString() })); } catch { /* niet erg */ }
  if (S.token) {
    fetch(`${SUPABASE_URL}/rest/v1/betalingen`, {
      method: "POST", keepalive: true,
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${S.token}`, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ deelnemer_id: S.ik.id, bedrag, datum: vandaag() }),
    }).catch(() => { /* wordt bij terugkomen opnieuw geprobeerd */ });
  }
  const blok = $("#betaalBlok");
  if (blok) blok.insertAdjacentHTML("afterbegin", `<div class="status goed">Je betaling van ${euro(bedrag)} is doorgegeven. Rond hem af in Tikkie.</div>`);
}
async function controleerTikkieBetaling() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(TIKKIE_BEWAAR) || "null"); } catch { /* leeg */ }
  if (!p || !S.ik) return;
  const weg = () => { try { localStorage.removeItem(TIKKIE_BEWAAR); } catch { /* niet erg */ } };
  if (p.wie !== S.ik.id || Date.now() - new Date(p.moment).getTime() > 2 * 3600 * 1000) return weg();
  const vanaf = new Date(new Date(p.moment).getTime() - 60 * 1000).toISOString();
  const { data, error } = await sb.from("betalingen").select("id, bedrag").eq("deelnemer_id", S.ik.id).gte("created_at", vanaf);
  if (error) return;
  if ((data || []).some(b => centen(b.bedrag) === centen(p.bedrag))) { weg(); S.tikkieBezig = false; return verversEnToon(); }
  const { error: e2 } = await sb.from("betalingen").insert({ deelnemer_id: S.ik.id, bedrag: p.bedrag, datum: vandaag() });
  if (e2) return;
  weg();
  S.tikkieBezig = false;
  toast(`Je betaling van ${euro(p.bedrag)} is doorgegeven.`);
  verversEnToon();
}

// Maakt van een foto een vierkant van px bij px, uit het midden, als JPEG
async function vierkant(bestand, px) {
  const bron = await createImageBitmap(bestand);
  const z = Math.min(bron.width, bron.height);
  const c = document.createElement("canvas");
  c.width = px; c.height = px;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(bron, (bron.width - z) / 2, (bron.height - z) / 2, z, z, 0, 0, px, px);
  return await new Promise((ok, mis) => c.toBlob(b => (b ? ok(b) : mis(new Error("Verkleinen mislukt"))), "image/jpeg", 0.82));
}

// Regels als "Grolsch groot 5,90" per regel; "3x Grolsch groot 5,90" geeft drie regels
function leesRegels(tekst) {
  const uit = [];
  for (const r of String(tekst || "").split(/\n/).map(x => x.trim()).filter(Boolean)) {
    const m = r.match(/^(?:(\d+)\s*[x×]\s*)?(.*?)[\s€-]*(\d+[.,]\d{2})$/i);
    if (!m) throw new Error(`Regel niet begrepen: "${r}"`);
    const aantal = Number(m[1] || 1);
    for (let i = 0; i < aantal; i++) uit.push({ omschrijving: m[2].trim() || "Artikel", bedrag: leesBedrag(m[3]) });
  }
  return uit;
}

function wedstrijdBijDatum(d) {

}

    ${isBeheerder() && ongesneden ? `<button type="button" class="tekstknop" id="snijBestaand" data-wed="${wedId}">Tijd en batterij wegsnijden bij ${ongesneden === 1 ? "deze screenshot" : `deze ${ongesneden} screenshots`}</button>` : ""}</div>`;
}
async function snijBestaande(wedId, knop) {
  const shots = S.screenshots.filter(x => x.wedstrijd_id === wedId && !/-k\.jpg$/.test(x.pad));
  knop.disabled = true;
  try {
    for (let i = 0; i < shots.length; i++) {
      knop.textContent = `Bezig: ${i + 1} van ${shots.length}…`;
      const x = shots[i];
      const { data: oud, error: e1 } = await sb.storage.from("screenshots").download(x.pad);
      if (e1) throw e1;
      const { blob, w, h } = await verklein(oud, true);
      const nieuw = x.pad.replace(/\.jpg$/, "") + "-k.jpg";
      const { error: e2 } = await sb.storage.from("screenshots").upload(nieuw, blob, { contentType: "image/jpeg", upsert: true });
      if (e2) throw e2;
      const { error: e3 } = await sb.from("screenshots").update({ pad: nieuw, breedte: w, hoogte: h }).eq("id", x.id);
      if (e3) throw e3;
      await sb.storage.from("screenshots").remove([x.pad]);
    }
    toast("Bijgesneden");
    verversEnToon();
  } catch (err) {
    knop.disabled = false;
    fout(err, "Bijsnijden");
  }
}
function urlVan(map, pad) {
  const u = S.urls[`${map}:${pad}`];
  return u && u.tot > Date.now() ? u.url : null;
}
async function urlsVoor(paden, map = "screenshots", stil = false) {
  const nu = Date.now();
  const nodig = paden.filter(p => !urlVan(map, p));
  if (!nodig.length) return;
  const { data, error } = await sb.storage.from(map).createSignedUrls(nodig, 3600);
  if (error) { if (!stil) fout(error, "Afbeeldingen laden"); return; }
  (data || []).forEach(d => { if (d.signedUrl) S.urls[`${map}:${d.path}`] = { url: d.signedUrl, tot: nu + 50 * 60 * 1000 }; });
}
async function vulPlaatjes(box) {
  const imgs = [...box.querySelectorAll("img[data-pad]")];
  if (!imgs.length) return;
  await urlsVoor([...new Set(imgs.map(i => i.dataset.pad))]);
  imgs.forEach(i => { const u = urlVan("screenshots", i.dataset.pad); if (u) i.src = u; });
  box.querySelectorAll("[data-kijk]").forEach(b => (b.onclick = () => openKijker(b.dataset.kijk)));
  const snij = box.querySelector("#snijBestaand");
  if (snij) snij.onclick = () => snijBestaande(snij.dataset.wed, snij);
}
