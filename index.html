  $("#kijkerTeller").textContent = kijkerLijst.length > 1 ? `${i + 1} / ${kijkerLijst.length}` : "";
  $("#kijkerVorige").hidden = i <= 0;
  $("#kijkerVolgende").hidden = i >= kijkerLijst.length - 1;
}
function kijkerNaar(i) {
  const r = $("#kijkerRol");
  r.scrollTo({ left: Math.max(0, Math.min(kijkerLijst.length - 1, i)) * r.clientWidth, behavior: "smooth" });
}
async function openKijker(id) {
  const x = S.screenshots.find(s => s.id === id);
  if (!x) return;
  kijkerLijst = S.screenshots.filter(s => s.wedstrijd_id === x.wedstrijd_id);
  await urlsVoor(kijkerLijst.map(s => s.pad));
  const rol = $("#kijkerRol");
  rol.innerHTML = kijkerLijst.map((s, i) => `<div class="dia"><img src="${esc(urlVan("screenshots", s.pad) || "")}" alt="Screenshot ${i + 1} van ${kijkerLijst.length}"></div>`).join("");
  $("#kijker").hidden = false;
  rol.scrollLeft = kijkerLijst.findIndex(s => s.id === id) * rol.clientWidth;
  kijkerBijwerken();
  $("#kijkerDicht").focus();
  const weg = $("#kijkerWeg");
  weg.hidden = !isBeheerder();
  weg.onclick = async () => {
    const huidig = kijkerLijst[kijkerIndex()];
    if (!huidig || !confirm("Deze screenshot verwijderen? De aankopen die eruit zijn gelezen, blijven staan.")) return;
    const { error: e1 } = await sb.storage.from("screenshots").remove([huidig.pad]);
    if (e1) return fout(e1, "Verwijderen");
    const { error: e2 } = await sb.from("screenshots").delete().eq("id", huidig.id);
    if (e2) return fout(e2, "Verwijderen");
    sluitKijker();
    toast("Screenshot verwijderd");
    verversEnToon();
  };
}
function sluitKijker() { $("#kijker").hidden = true; $("#kijkerRol").innerHTML = ""; kijkerLijst = []; }
$("#kijkerDicht").onclick = sluitKijker;
$("#kijkerVorige").onclick = () => kijkerNaar(kijkerIndex() - 1);
$("#kijkerVolgende").onclick = () => kijkerNaar(kijkerIndex() + 1);
$("#kijkerRol").addEventListener("scroll", () => requestAnimationFrame(kijkerBijwerken), { passive: true });
document.addEventListener("keydown", e => {
  if ($("#kijker").hidden) return;
  if (e.key === "ArrowLeft") kijkerNaar(kijkerIndex() - 1);
  if (e.key === "ArrowRight") kijkerNaar(kijkerIndex() + 1);
});

// ---------------------------------------------------------------------
// Screenshots inlezen met AI
// ---------------------------------------------------------------------
// Hoogte van de statusbalk (tijd, bereik, batterij) bovenaan een telefoonscreenshot
function statusbalk(w, h) {
  const r = h / w;
  if (r >= 2.1 && r <= 2.3) return Math.round(w * 0.145);    // iPhone met notch of Dynamic Island
  if (r >= 1.76 && r <= 1.79) return Math.round(w * 0.055);  // oudere iPhone met thuisknop (16:9)
  return 0;                                                   // al bijgesneden of geen telefoonscreenshot
}
async function verklein(bestand, snijden = true) {
  const bron = await createImageBitmap(bestand);
  const top = snijden ? statusbalk(bron.width, bron.height) : 0;
  const bh = bron.height - top;
  const max = 2000;
  const f = Math.min(1, max / Math.max(bron.width, bh));
  const w = Math.round(bron.width * f), h = Math.round(bh * f);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(bron, 0, top, bron.width, bh, 0, 0, w, h);
  const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85));
  return { blob, w, h, gesneden: top > 0 };
}

async function roepFunctie(naam, body) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(`${SUPABASE_URL}/functions/v1/${naam}`, {
    method: "POST",
    headers: { Authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.fout || j.message || `foutcode ${r.status}`);
  return j;
}

function toonInlezen(wedId) {
  const wedstrijd = S.wedstrijden.find(x => x.id === wedId);
  if (!wedstrijd) { location.hash = "wedstrijden"; return; }
  titel("Screenshots inlezen", `wedstrijd/${wedId}`);
  scherm().innerHTML = `
    <div class="vlak">
      <p class="klein muted">Maak in de app van FC Twente screenshots van de Transactie Geschiedenis. Tik ook een aankoop aan en maak een screenshot van het venster met de artikelen. Je mag tot 10 screenshots tegelijk kiezen.</p>
      <h3>${esc(wedstrijd.tegenstander)}, ${datumKort(wedstrijd.datum)}</h3>
      <label class="veld"><span>Screenshots</span><input type="file" id="inBest" accept="image/*" multiple></label>
      <label class="knoppen klein" style="flex-wrap:nowrap"><input type="checkbox" id="inSnijden" checked style="width:20px;height:20px;min-height:0;accent-color:var(--rood)"> Tijd en batterij bovenaan wegsnijden</label>
      <div class="galerij" id="inDuim"></div>
      <button class="knop" id="inLees" disabled>Uploaden en uitlezen</button>
      <p class="klein muted" id="inStatus" role="status"></p>
    </div>
    <div id="inUitkomst" class="stapel"></div>`;

  let bestanden = [], klaar = [];
  const voorbereiden = async () => {
    $("#inLees").disabled = true;
    klaar = [];
    for (const f of bestanden) klaar.push(await verklein(f, $("#inSnijden").checked));
    $("#inDuim").innerHTML = klaar.map(k => `<div class="duim"><img src="${URL.createObjectURL(k.blob)}" alt=""></div>`).join("");
    $("#inLees").disabled = !klaar.length;
  };
  $("#inBest").onchange = e => {
    bestanden = [...e.target.files].slice(0, 10);
    if (e.target.files.length > 10) toast("Alleen de eerste 10 screenshots worden gebruikt.");
    voorbereiden();
  };
  $("#inSnijden").onchange = () => { if (bestanden.length) voorbereiden(); };
  $("#inLees").onclick = async () => {
    const knop = $("#inLees"), status = $("#inStatus");
    const wed = wedId;
    knop.disabled = true;
    try {
      const paden = [], rijen = [];
      for (let i = 0; i < klaar.length; i++) {
        status.textContent = `Screenshot ${i + 1} van ${klaar.length} uploaden…`;
        const { blob, w, h, gesneden } = klaar[i];
        const pad = `${wed}/${crypto.randomUUID()}${gesneden ? "-k" : ""}.jpg`;
        const { error } = await sb.storage.from("screenshots").upload(pad, blob, { contentType: "image/jpeg" });
        if (error) throw error;
        paden.push(pad);
        rijen.push({ wedstrijd_id: wed, pad, breedte: w, hoogte: h });
      }
      const { data: shots, error: e2 } = await sb.from("screenshots").insert(rijen).select();
      if (e2) throw e2;
      const shotIds = paden.map(p => shots.find(x => x.pad === p)?.id || null);
      await lees(paden, shotIds, wed);
    } catch (err) {
      status.textContent = "";
      knop.disabled = false;
      fout(err, "Uploaden");
    }
  };

  async function lees(paden, shotIds, wed) {
    const status = $("#inStatus");
    status.textContent = "De AI leest de screenshots uit… dit duurt meestal 10 tot 30 seconden.";
    try {
      const res = await roepFunctie("kaart-lezen", { paden });
      status.textContent = `Uitgelezen door ${res.model}.`;
      await laad();
      S.voorstel = maakVoorstel(res, shotIds, wed);
      toonVoorstel();
      $("#inUitkomst").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (err) {
      status.textContent = "";
      $("#inUitkomst").innerHTML = `<div class="status let">Uitlezen lukte niet: ${esc(err.message)}<br>
        De screenshots zijn wel opgeslagen bij de wedstrijd.</div>
        <button class="knop" id="opnieuw" style="justify-self:start">Opnieuw uitlezen</button>`;
      $("#opnieuw").onclick = () => { $("#inUitkomst").innerHTML = ""; lees(paden, shotIds, wed); };
    }
  }
}

// Bekende stukprijzen per artikel, de nieuwste eerst (datum van de laatste aankoop met die prijs)
function bekendePrijzen() {
  const datumVan = Object.fromEntries(S.transacties.map(t => [t.id, t.datum]));
  const laatst = {};
  S.regels.forEach(r => {
    const k = r.omschrijving.trim().toLowerCase();
    const c = centen(r.bedrag);
    const d = datumVan[r.transactie_id] || "";
    (laatst[k] ||= {});
    if (!laatst[k][c] || laatst[k][c] < d) laatst[k][c] = d;
  });
  const uit = {};
  for (const [k, prijzen] of Object.entries(laatst)) {
    uit[k] = Object.entries(prijzen).sort((a, b) => b[1].localeCompare(a[1]) || a[0] - b[0]).map(([c]) => Number(c) / 100);
  }
  return uit;
}

// "Grolsch groot € 23,60" terwijl een Grolsch groot € 5,90 kost: dat zijn 4 stuks.
// Eerst vergelijken met losse stuks op dezelfde screenshots (de actuele prijs),
// daarna met de bekende prijzen van eerdere wedstrijden, de nieuwste eerst.
function splitsMeervouden(lijst) {
  const naam = x => x.trim().toLowerCase();
  const bekend = bekendePrijzen();
  const nu = {};
  lijst.forEach(t => (t.artikelen || []).forEach(a => {
    const k = naam(a.omschrijving);
    if (!(k in nu) || a.prijs < nu[k]) nu[k] = a.prijs;
  }));
  lijst.forEach(t => (t.artikelen || []).forEach(a => {
    if (a.aantal !== 1) return;
    const k = naam(a.omschrijving);
    for (const p of [nu[k], ...(bekend[k] || [])]) {
      if (!(p > 0) || a.prijs <= p) continue;
      const n = Math.round(a.prijs / p);
      if (n >= 2 && n <= 30 && centen(a.prijs) === n * centen(p)) { a.aantal = n; a.prijs = p; a.gesplitst = true; return; }
    }
  }));
}

function maakVoorstel(res, shotIds, wed) {
  splitsMeervouden(res.transacties);
  const gebruikt = new Set();
  const regels = res.transacties.filter(t => t.soort === "aankoop").map((t, i) => {
    const bestaand = S.transacties.find(x => !gebruikt.has(x.id) && x.soort === t.soort && x.datum === t.datum &&
      (x.kassa || "") === (t.kassa || "") && centen(x.bedrag) === centen(t.bedrag));
    if (bestaand) gebruikt.add(bestaand.id);
    const heeftRegels = bestaand && S.regels.some(r => r.transactie_id === bestaand.id);
    const wedOpDatum = S.wedstrijden.find(w => w.datum === t.datum);
    const wedId = t.soort === "aankoop" ? (wedOpDatum?.id || wed) : null;
    const spreadsheet = wedId && S.transacties.some(x => x.wedstrijd_id === wedId && x.bron === "spreadsheet");
    let status = "nieuw";
    if (bestaand) status = (!bestaand.tijd && t.tijd) || (!heeftRegels && t.artikelen.length) ? "aanvullen" : "bestaat";
    else if (spreadsheet) status = "spreadsheet";
    const somArt = t.artikelen.reduce((s, a) => s + a.prijs * a.aantal, 0);
    return {
      i, t, bestaand, wedId, status, datumAfwijkend: t.soort === "aankoop" && !wedOpDatum,
      aan: status === "nieuw" || status === "aanvullen",
      artFout: t.artikelen.length > 0 && centen(somArt) !== centen(t.bedrag),
      shotId: shotIds[t.bron] ?? shotIds[0],
    };
  });
  return { res, regels, wed, shotIds };
}

function toonVoorstel() {
  const V = S.voorstel;
  const box = $("#inUitkomst");
  if (!V.regels.length) {
    box.innerHTML = `<div class="status let">De AI vond geen transacties op deze screenshots. Ze zijn wel opgeslagen bij de wedstrijd.</div>`;
    return;
  }
  const tekst = {
    nieuw: ["nieuw", "Nieuw"],
    aanvullen: ["aanvullen", "Staat er al, wordt aangevuld"],
    bestaat: ["bestaat", "Staat er al"],
    spreadsheet: ["let", "Wedstrijd heeft al een totaal uit de spreadsheet"],
  };
  const wedOpties = sel => S.wedstrijden.filter(w => w.datum <= vandaag()).slice().reverse()
    .map(w => `<option value="${w.id}" ${w.id === sel ? "selected" : ""}>${datumKort(w.datum)}, ${esc(w.tegenstander)}</option>`).join("");
  box.innerHTML = `
    <div class="vlak" id="voorstelVlak">
      <h3>Gevonden op de screenshots</h3>
      <p class="klein muted">Controleer de bedragen. Aangevinkte regels worden opgeslagen.</p>
      <div>${V.regels.map(r => {
        const t = r.t;
        const art = t.artikelen.map(a => `${a.aantal > 1 ? `${a.aantal}× ` : ""}${esc(a.omschrijving)} à ${euro(a.prijs)}${a.gesplitst ? " (stukprijs herkend)" : ""}`).join(", ");
        return `<div class="voorstel">
          <input type="checkbox" data-v="${r.i}" ${r.aan ? "checked" : ""} ${r.status === "bestaat" ? "disabled" : ""} aria-label="Opslaan">
          <span><b>${t.soort === "opwaardering" ? "Opwaardering" : esc(t.kassa || "Aankoop")}</b><br>
            <span class="klein muted">${datumKort(t.datum)}${t.tijd ? `, ${t.tijd}` : ""}</span></span>
          <b class="getal">${t.soort === "opwaardering" ? "+" : ""}${euro(t.bedrag)}</b>
          <div class="extra">
            <span><span class="label ${tekst[r.status][0]}">${tekst[r.status][1]}</span></span>
            ${art ? `<span class="klein">${art}</span>` : ""}
            ${r.artFout ? `<span class="klein open">De artikelen tellen niet op tot ${euro(t.bedrag)}. Controleer de screenshot.</span>` : ""}
            ${t.soort === "aankoop" && !r.bestaand ? `<label class="veld"><span>${r.datumAfwijkend ? "Geen wedstrijd op deze datum. Kies de wedstrijd:" : "Wedstrijd"}</span>
              <select data-w="${r.i}">${wedOpties(r.wedId)}</select></label>` : ""}
          </div></div>`;
      }).join("")}</div>
      <div id="saldoCheck"></div>
      <button class="knop" id="voorstelOpslaan">Opslaan</button>
    </div>`;

  const saldoCheck = () => {
    const nieuw = V.regels.filter(r => r.aan && !r.bestaand);
    const verwacht = Number(S.pot.saldo_kaart)
      - nieuw.filter(r => r.t.soort === "aankoop").reduce((s, r) => s + r.t.bedrag, 0)
      + nieuw.filter(r => r.t.soort === "opwaardering").reduce((s, r) => s + r.t.bedrag, 0);
    const kaart = V.res.saldo;
    $("#saldoCheck").innerHTML = kaart === null
      ? `<p class="klein muted">Na opslaan berekent de app ${euro(verwacht)} op de kaart. Het tegoed was niet te zien op de screenshots.</p>`
      : centen(kaart) === centen(verwacht)
        ? `<div class="status goed">Na opslaan klopt de kaart precies: ${euro(verwacht)}, gelijk aan het Privé Tegoed.</div>`
        : `<div class="status let">Na opslaan berekent de app ${euro(verwacht)}, maar het Privé Tegoed is ${euro(kaart)}. Verschil: ${euro(verwacht - kaart)}. Misschien ontbreekt er een aankoop, of is een opwaardering nog niet ingevoerd onder Beheer, Kaart.</div>`;
  };
  saldoCheck();
  box.querySelectorAll("[data-v]").forEach(c => (c.onchange = () => { V.regels[c.dataset.v].aan = c.checked; saldoCheck(); }));
  box.querySelectorAll("[data-w]").forEach(s => (s.onchange = () => { V.regels[s.dataset.w].wedId = s.value; }));
  $("#voorstelOpslaan").onclick = slaVoorstelOp;
}

// Screenshots bij een wedstrijd waarvan nog niets is opgeslagen
function onverwerkteShots(wedId) {
  return S.screenshots.filter(x => x.wedstrijd_id === wedId && !x.uitgelezen?.verwerkt &&
    !S.transacties.some(t => t.screenshot_id === x.id));
}

// Transacties van verschillende screenshots samenvoegen
function voegSamen(lijst) {
  const sleutel = t => `${t.soort}|${t.kassa || ""}|${t.datum}|${centen(t.bedrag)}`;
  const detail = t => (t.tijd ? 1 : 0) + (t.artikelen?.length ? 2 : 0);
  const uit = [];
  for (const t of lijst) {
    const j = uit.findIndex(u => sleutel(u) === sleutel(t) &&
      (u.bron !== t.bron || !detail(u) || !detail(t)) &&
      (!u.tijd || !t.tijd || u.tijd === t.tijd));
    if (j < 0) uit.push(t);
    else if (detail(t) > detail(uit[j])) uit[j] = t;
  }
  return uit;
}

async function toonVerwerken(wedId) {
  const w = S.wedstrijden.find(x => x.id === wedId);
  titel("Voorstel verwerken", `wedstrijd/${wedId}`);
  scherm().innerHTML = `
    <div class="vlak"><h3>${esc(w?.tegenstander || "Wedstrijd")}</h3>
      <p class="klein muted" id="inStatus" role="status">Voorstel maken…</p></div>
    <div id="inUitkomst" class="stapel"></div>`;
  const status = $("#inStatus");
  let shots = onverwerkteShots(wedId);
  const ongelezen = shots.filter(x => !x.uitgelezen);
  if (ongelezen.length) {
    status.textContent = "De AI leest de screenshots uit… dit duurt meestal 10 tot 30 seconden.";
    try {
      await roepFunctie("kaart-lezen", { paden: ongelezen.map(x => x.pad) });
      await laad();
      shots = onverwerkteShots(wedId);
    } catch (err) {
      fout(err, "Uitlezen");
    }
  }
  const gelezen = shots.filter(x => x.uitgelezen);
  if (!gelezen.length) {
    status.textContent = "Er is niets om te verwerken.";
    return;
  }
  const saldi = gelezen.filter(x => x.uitgelezen.saldo !== null && x.uitgelezen.saldo !== undefined);
  const res = {
    saldo: saldi.length ? Number(saldi[saldi.length - 1].uitgelezen.saldo) : null,
    transacties: voegSamen(gelezen.flatMap((x, i) => (x.uitgelezen.transacties || []).map(t => ({ ...t, bron: i })))),
  };
  const modellen = [...new Set(gelezen.map(x => x.uitgelezen.model).filter(Boolean))].join(", ");
  status.textContent = `${gelezen.length} ${gelezen.length === 1 ? "screenshot" : "screenshots"}, uitgelezen door ${modellen || "de AI"}.`;
  S.voorstel = maakVoorstel(res, gelezen.map(x => x.id), wedId);
  toonVoorstel();
}

async function slaVoorstelOp() {
  const V = S.voorstel;
  const knop = $("#voorstelOpslaan");
  knop.disabled = true;
  const wedPerShot = {};
  const artikelRegels = (tid, t) => {
    const uit = [];
    t.artikelen.forEach(a => { for (let k = 0; k < a.aantal; k++) uit.push({ transactie_id: tid, omschrijving: a.omschrijving, bedrag: a.prijs, volgorde: uit.length }); });
    return uit;
  };
  try {
    let n = 0;
    for (const r of V.regels.filter(x => x.aan)) {
      const t = r.t;
      let tid;
      if (r.bestaand) {
        tid = r.bestaand.id;
        const upd = {};
        if (!r.bestaand.tijd && t.tijd) upd.tijd = t.tijd;
        if (!r.bestaand.screenshot_id && r.shotId) upd.screenshot_id = r.shotId;
        if (Object.keys(upd).length) {
          const { error } = await sb.from("transacties").update(upd).eq("id", tid);
          if (error) throw error;
        }
        if (t.artikelen.length && !S.regels.some(x => x.transactie_id === tid)) {
          const { error } = await sb.from("transactie_regels").insert(artikelRegels(tid, t));
          if (error) throw error;
        }
        if (r.bestaand.wedstrijd_id) wedPerShot[t.bron] ??= r.bestaand.wedstrijd_id;
      } else {
        const { data, error } = await sb.from("transacties").insert({
          soort: t.soort, wedstrijd_id: t.soort === "aankoop" ? r.wedId : null, datum: t.datum, tijd: t.tijd,
          kassa: t.kassa, bedrag: t.bedrag, bron: "ai", screenshot_id: r.shotId,
        }).select().single();
        if (error) throw error;
        tid = data.id;
        if (t.artikelen.length) {
          const { error: e2 } = await sb.from("transactie_regels").insert(artikelRegels(tid, t));
          if (e2) throw e2;
        }
        if (t.soort === "aankoop") wedPerShot[t.bron] ??= r.wedId;
      }
      n++;
    }
    // Screenshots als verwerkt markeren
    for (const sid of V.shotIds.filter(Boolean)) {
      const sh = S.screenshots.find(x => x.id === sid);
      await sb.from("screenshots").update({ uitgelezen: { ...(sh?.uitgelezen || {}), verwerkt: true } }).eq("id", sid);
    }
    // Screenshots verhuizen naar de wedstrijd waar hun aankopen bij horen
    for (const [bron, wid] of Object.entries(wedPerShot)) {
      const sid = V.shotIds[bron];
      if (sid && wid && wid !== V.wed) await sb.from("screenshots").update({ wedstrijd_id: wid }).eq("id", sid);
    }
    toast(`${n} ${n === 1 ? "regel" : "regels"} opgeslagen`);
    const wedMelding = Object.values(wedPerShot)[0] || V.wed;
    if (n > 0 && wedMelding) roepFunctie("meldingen", { soort: "ingelezen", wedstrijd_id: wedMelding })
      .then(r => { if (r.verstuurd) toast(`Melding gestuurd naar ${r.ontvangers} ${r.ontvangers === 1 ? "deelnemer" : "deelnemers"}`); })
      .catch(() => { /* melding is bijzaak */ });
    S.voorstel = null;
    await laad();
    location.hash = `wedstrijd/${Object.values(wedPerShot)[0] || V.wed}`;
  } catch (err) {
    knop.disabled = false;
    fout(err, "Opslaan");
  }
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* geen meldingen mogelijk */ });
  navigator.serviceWorker.addEventListener("message", e => {
    const u = e.data && e.data.open;
    if (u && u.includes("#")) location.hash = u.slice(u.indexOf("#") + 1);
  });
}
